<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление заявками — Electro Modus</title>
    <link rel="stylesheet" href="./styles/styles.css">
    <script src="./scripts/auth.js" defer></script>
</head>
<body style="background: var(--bg);">
    <header class="topbar">
        <a href="index.html" class="topbar__brand">
            <div class="topbar__icon">⚡</div>
            <span class="topbar__name">Electro Modus</span>
        </a>
        <div class="topbar__contact">
            <a href="dashboard.html" class="topbar__cta">В кабинет</a>
        </div>
    </header>

    <main class="content" style="padding: 40px 20px;">
        <div style="max-width: 1000px; margin: 0 auto;">
            <h1 class="section__title" style="text-align: left;">Управление заявками (Leads)</h1>
            
            <div id="leads-error" style="margin: 20px 0; padding: 15px; border-radius: 8px; display: none; background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid #ef444433;"></div>

            <div class="card" style="margin-top: 20px;">
                <table style="width: 100%; border-collapse: collapse; color: var(--text);">
                    <thead>
                        <tr style="border-bottom: 1px solid rgba(255,255,255,0.1); text-align: left;">
                            <th style="padding: 15px;">Дата</th>
                            <th style="padding: 15px;">Имя</th>
                            <th style="padding: 15px;">Телефон</th>
                            <th style="padding: 15px;">Сообщение</th>
                            <th style="padding: 15px;">Действие</th>
                        </tr>
                    </thead>
                    <tbody id="leads-table-body">
                        <!-- Сюда подгрузятся заявки -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        async function deleteLead(id) {
            if (!confirm('Удалить эту заявку?')) return;
            try {
                const response = await fetch('/api/admin/leads/delete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ leadId: id })
                });
                if (response.ok) {
                    loadLeads();
                } else {
                    alert('Ошибка при удалении');
                }
            } catch (err) {
                console.error(err);
            }
        }

        async function loadLeads() {
            try {
                const response = await fetch('/api/admin/leads');
                const data = await response.json();
                
                if (!response.ok) {
                    const errDiv = document.getElementById('leads-error');
                    errDiv.innerText = data.error || 'Ошибка доступа';
                    errDiv.style.display = 'block';
                    if (response.status === 401 || response.status === 403) {
                        setTimeout(() => window.location.href = 'dashboard.html', 2000);
                    }
                    return;
                }

                const tbody = document.getElementById('leads-table-body');
                tbody.innerHTML = '';

                data.leads.forEach(lead => {
                    const row = document.createElement('tr');
                    row.style.borderBottom = '1px solid rgba(255,255,255,0.05)';
                    const date = new Date(lead.created_at).toLocaleString();
                    
                    row.innerHTML = `
                        <td style="padding: 15px; font-size: 0.85rem; color: var(--text-muted);">${date}</td>
                        <td style="padding: 15px; font-weight: 600;">${lead.name}</td>
                        <td style="padding: 15px;"><a href="tel:${lead.phone}" style="color: var(--accent); text-decoration: none;">${lead.phone}</a></td>
                        <td style="padding: 15px; font-size: 0.9rem;">${lead.message || '-'}</td>
                        <td style="padding: 15px;">
                            <button onclick="deleteLead(${lead.id})" class="btn btn--ghost" style="color: #ef4444; border-color: #ef444433; padding: 5px 10px; font-size: 0.8rem;">Удалить</button>
                        </td>
                    `;
                    tbody.appendChild(row);
                });
            } catch (err) {
                console.error('Error loading leads:', err);
            }
        }

        window.addEventListener('load', loadLeads);
    </script>
</body>
</html>
