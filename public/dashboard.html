<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет — ЭлектроМонтаж Pro</title>
    <meta name="description" content="Кабинет клиента">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles/styles.css">
    <script src="./scripts/auth.js" defer></script>
</head>

<body>
    <header class="topbar">
        <a href="index.html" class="topbar__brand">
            <div class="topbar__icon">⚡</div>
            <span class="topbar__name">Electro Modus</span>
        </a>
        <div class="topbar__contact">
            <a href="index.html" class="topbar__cta">На главную</a>
            <button id="btn-admin-panel" class="btn btn--primary" style="margin-left: 10px; display: none;">Админ панель</button>
            <button id="btn-logout" class="btn btn--ghost" style="margin-left: 10px;">Выйти</button>
        </div>
    </header>

    <div class="layout">
        <main class="content" style="padding: 40px 20px;">
            <div style="max-width: 900px; margin: 0 auto;">
                <section class="section">
                <div class="dashboard-box">
                    <h2 class="section__title">Добро пожаловать в личный кабинет!</h2>
                    <p class="section__subtitle" id="dashboard-email">Загрузка...</p>
                    
                    <div class="dashboard-grid">
                        <div class="card">
                            <h3 class="card__title" style="margin-bottom: 15px;">Личные данные</h3>
                            <form id="profile-form" style="display: flex; flex-direction: column; gap: 15px;">
                                <div>
                                    <label class="form-label">Email (Логин)</label>
                                    <input type="email" id="profile-email" class="form-input" disabled style="opacity: 0.7;">
                                </div>
                                <div>
                                    <label class="form-label">Имя</label>
                                    <input type="text" id="profile-name" class="form-input" placeholder="Введите ваше имя">
                                </div>
                                <div>
                                    <label class="form-label">Телефон</label>
                                    <input type="tel" id="profile-phone" class="form-input" placeholder="+370 XXX XX XXX">
                                </div>
                                <button type="submit" class="btn btn--primary">Сохранить изменения</button>
                                <p id="profile-message" style="margin-top: 10px; font-size: 0.9rem;"></p>
                            </form>
                        </div>
                        
                        <div class="card">
                            <h3 class="card__title" style="margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center;">
                                Мои заявки
                                <button class="btn btn--ghost btn--small" onclick="document.getElementById('new-ticket-modal').style.display='flex'" style="padding: 5px 10px; font-size: 0.8rem;">+ Новая заявка</button>
                            </h3>
                            <div id="tickets-list" style="display: flex; flex-direction: column; gap: 10px; max-height: 350px; overflow-y: auto;">
                                <p style="color: var(--text-secondary); font-size: 0.9rem;">Загрузка...</p>
                            </div>
                        </div>
                    </div>

                </div>
            </section>
            </div>
        </main>
    </div>
    <!-- ADMIN MODAL -->
    <div id="admin-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="close-modal" id="close-admin-modal">&times;</span>
            <h2 class="section__title" style="text-align: left; margin-bottom: 10px;">Панель управления</h2>
            <p class="section__subtitle" style="text-align: left;">Выберите раздел для управления системой</p>
            <div class="admin-menu-grid">
                <a href="admin.html" class="admin-menu-item">
                    <div class="admin-menu-icon">👥</div>
                    <span>Пользователи</span>
                </a>
                <a href="admin-prices.html" class="admin-menu-item">
                    <div class="admin-menu-icon">💰</div>
                    <span>Цены</span>
                </a>
                <a href="admin-leads.html" class="admin-menu-item">
                    <div class="admin-menu-icon">📬</div>
                    <span>Заявки</span>
                </a>
                <div class="admin-menu-item disabled">
                    <div class="admin-menu-icon">⚙️</div>
                    <span>Настройки</span>
                </div>
                <a href="admin-tickets.html" class="admin-menu-item">
                    <div class="admin-menu-icon">🎫</div>
                    <span>Тикеты (Чат)</span>
                </a>
            </div>
        </div>
    </div>
    <!-- NEW TICKET MODAL -->
    <div id="new-ticket-modal" class="modal" style="display: none;">
        <div class="modal-content" style="max-width: 500px;">
            <span class="close-modal" onclick="document.getElementById('new-ticket-modal').style.display='none'">&times;</span>
            <h2 class="section__title" style="text-align: left; margin-bottom: 15px;">Новая заявка</h2>
            <form id="new-ticket-form" style="display: flex; flex-direction: column; gap: 15px;">
                <div>
                    <label class="form-label">Тема</label>
                    <input type="text" id="ticket-title" class="form-input" required placeholder="Краткое описание проблемы">
                </div>
                <div>
                    <label class="form-label">Описание</label>
                    <textarea id="ticket-desc" class="form-input" rows="4" placeholder="Подробно опишите задачу или проблему..."></textarea>
                </div>
                <button type="submit" class="btn btn--primary">Создать</button>
            </form>
        </div>
    </div>

    <!-- VIEW TICKET MODAL -->
    <div id="view-ticket-modal" class="modal" style="display: none;">
        <div class="modal-content" style="max-width: 600px; display: flex; flex-direction: column; height: 80vh;">
            <span class="close-modal" onclick="document.getElementById('view-ticket-modal').style.display='none'">&times;</span>
            <h2 class="section__title" id="vt-title" style="text-align: left; margin-bottom: 5px; font-size: 1.2rem;">Загрузка...</h2>
            <p id="vt-status" style="font-size: 0.9rem; color: var(--accent); margin-bottom: 10px;">Статус</p>
            <p id="vt-desc" style="font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 15px; white-space: pre-wrap; padding: 10px; background: rgba(255,255,255,0.02); border-radius: var(--radius-sm); border-left: 3px solid var(--border);"></p>
            
            <div id="vt-messages" style="flex: 1; overflow-y: auto; background: var(--bg-base); border-radius: var(--radius-sm); padding: 15px; display: flex; flex-direction: column; gap: 15px; margin-bottom: 15px; border: 1px solid var(--border);">
                <!-- Messages go here -->
            </div>

            <form id="ticket-msg-form" style="display: flex; gap: 10px;">
                <input type="text" id="ticket-msg-input" class="form-input" placeholder="Написать сообщение..." style="flex: 1; margin: 0;" required>
                <button type="submit" class="btn btn--primary" style="padding: 0 20px;">Отправить</button>
            </form>
        </div>
    </div>
</body>
</html>
