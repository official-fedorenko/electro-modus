<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ Панель — Electro Modus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles/styles.css">
    <script src="./scripts/admin.js" defer></script>
</head>
<body style="background: var(--bg);">
    <!-- Role Modal -->
    <div id="role-modal" class="modal" style="display: none;">
        <div class="modal-content" style="max-width: 400px;">
            <span class="close-modal" id="close-role-modal">&times;</span>
            <h2 class="section__title" style="text-align: center; margin-bottom: 20px;">Изменить роль</h2>
            <div id="role-options" class="role-grid" style="display: grid; gap: 10px;">
                <!-- Roles will be injected here -->
            </div>
            <p id="role-modal-email" style="margin-top: 20px; text-align: center; opacity: 0.5; font-size: 0.8rem;"></p>
        </div>
    </div>

    <header class="topbar">
        <a href="index.html" class="topbar__brand">
            <div class="topbar__icon">⚡</div>
            <span class="topbar__name">Electro Modus <span style="color:var(--accent)">[ADMIN]</span></span>
        </a>
        <div class="topbar__contact">
            <a href="dashboard.html" class="topbar__cta">В кабинет</a>
        </div>
    </header>

    <div class="layout">
        <main class="content" style="padding: 40px 20px;">
            <div style="max-width: 1000px; margin: 0 auto;">
                <div class="admin-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
                    <h2 class="section__title" style="margin: 0;">Управление пользователями</h2>
                    <button id="btn-refresh" class="btn btn--primary">Обновить</button>
                </div>
                
                <div class="card" style="margin-bottom: 20px; padding: 15px;">
                    <input type="text" id="user-search" class="form-input" placeholder="Поиск по Email или роли..." style="margin: 0; background: rgba(255,255,255,0.03);">
                </div>

                <div id="admin-msg" class="msg" style="color: #10b981; margin-bottom: 10px;"></div>
                <div id="admin-error" class="error" style="color: #ef4444; margin-bottom: 10px;"></div>

                <div class="card" style="padding: 0; overflow-x: auto;">
                    <table class="admin-table" style="width: 100%; border-collapse: collapse; color: var(--text);">
                        <thead>
                            <tr style="border-bottom: 1px solid rgba(255,255,255,0.1); text-align: left;">
                                <th style="padding: 15px;">ID</th>
                                <th style="padding: 15px;">Email</th>
                                <th style="padding: 15px;">Роль</th>
                                <th style="padding: 15px;">Регистрация</th>
                                <th style="padding: 15px;">Действие</th>
                            </tr>
                        </thead>
                        <tbody id="users-tbody">
                        <tr><td colspan="5">Загрузка...</td></tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
</body>
</html>
